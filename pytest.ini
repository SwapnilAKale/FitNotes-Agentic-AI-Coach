[pytest]
# The real suite lives entirely under tests/. Without this, pytest recurses
# into scripts/ and collects the manual dev scripts named test_*.py —
# scripts/test_memory.py executes a LIVE Gemini call at import (collection)
# time: a quota burn and a multi-minute hang on every bare `pytest` run.
testpaths = tests

# langsmith ships a pytest plugin that pytest auto-loads through entry points.
# Nothing in this suite uses it, but it imports uuid_utils, whose compiled .pyd
# Windows Application Control can block — which took the ENTIRE run down with
# "DLL load failed while importing _uuid_utils" at collection time (2026-08-03).
# An optional tracing plugin must not be able to do that.
addopts = -p no:langsmith_plugin
